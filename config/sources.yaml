# InsightRadar — 多源信息摄取配置
# 模块化、可扩展；所有输入统一为 NormalizedDocument

rss:
  - name: tech_crunch
    url: https://techcrunch.com/feed/
    category: tech
  - name: hacker_news_rss
    url: https://hnrss.org/frontpage
    category: tech
  - name: reuters_tech
    url: https://www.reutersagency.com/feed/?best-topics=tech
    category: tech
  - name: arxiv_cs_ai
    url: http://rss.arxiv.org/rss/cs.AI
    category: academic

web_scrape:
  - name: hn_frontpage
    url: https://news.ycombinator.com/
    selector: "span.titleline > a"
    category: tech
    max_items: 30

local:
  base_path: ./data/local
  extensions: [".txt", ".md"]
  recursive: true

# 情绪与趋势计算可选参数
processing:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  cluster_min_size: 3
  trend_significant_delta: 15  # TrendScore 变化超过此值才生成新 Insight
